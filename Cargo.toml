[package]
name = "mldsa-verify-otf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Small-stack ML-DSA signature verification (FIPS 204) with on-the-fly matrix expansion"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
shake = { version = "0.1", default-features = false }

[dev-dependencies]
hex = { version = "0.4", features = ["serde"] }
ml-dsa = "0.1"
shake = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
manual_let_else = "warn"

# The tests run in release, so keep i32 overflows visible there.
[profile.release]
overflow-checks = true
